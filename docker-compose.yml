volumes:
  pgData:

services:
  # 前端靜態網站
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://127.0.0.1:8080/api/
    ports:
      - "3000:80"

  # API 文件與互動式請求介面
  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      - SWAGGER_JSON=/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro
    ports:
      - "8081:8080"

  # PostgreSQL 與持久化儲存空間
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      - POSTGRES_USER=rfitness_app
      - POSTGRES_PASSWORD=rfitness_local_password
      - POSTGRES_DB=fitness
    volumes:
      - pgData:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfitness_app -d fitness"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Express API，等待資料庫就緒後啟動。
  backend:
    build:
      context: ./backend

      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # 容器網路透過服務名稱連線資料庫。
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=rfitness_app
      - DB_PASSWORD=rfitness_local_password
      - DB_DATABASE=fitness
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the shell or root .env before starting Docker Compose}
      - JWT_EXPIRES_DAY=30d
      - DB_SYNCHRONIZE=true
      - DB_ENABLE_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:8080/healthcheck'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
