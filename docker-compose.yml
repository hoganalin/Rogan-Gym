volumes:
  pgData:

services:
  # 健身房前端（成品）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://127.0.0.1:8080/api/
    ports:
      - "3000:80"

  # API 文件（Swagger UI，瀏覽 + Try it out 試打你的後端）
  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      - SWAGGER_JSON=/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro
    ports:
      - "8081:8080"

  # PostgreSQL（空的資料庫，等你的後端來建表）
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      - POSTGRES_USER=student
      - POSTGRES_PASSWORD=student666
      - POSTGRES_DB=fitness
    volumes:
      - pgData:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d fitness"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # 後端容器化：backend/ 內既有的 Express 應用
  #   - 服務名稱 backend，對外開放 8080
  #   - 容器裡連資料庫走 postgres（不是 localhost）
  #   - healthcheck 打 GET /healthcheck，並等待 postgres healthy 後才啟動
  # ============================================================
  backend:
    build:
      context: ./backend

      dockerfile: Dockerfile
    ports:
      # 左: 外部使用者要連線時，就是打這個 port
      # 右: 容器內的 port（Docker 裡面監聽的 port）
      - "8080:8080"
    environment: # 需要哪些變數？可根據 .env.example 對照補齊
      - PORT=8080
      # 啟動的方式使用容器了,所以DB-HOST改成postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=student
      - DB_PASSWORD=student666
      - DB_DATABASE=fitness
      - JWT_SECRET=node2026
      - JWT_EXPIRES_DAY=30d
      - DB_SYNCHRONIZE=true
      - DB_ENABLE_SSL=false
    depends_on:
      # postgres 這個名稱來自方定義的資料庫名稱
      postgres:
        condition: service_healthy
        # service_started → 確保啟動順序，但不保證健康。
        # service_healthy → 確保依賴服務真的 ready（最常用在 DB、API）。
        # service_completed_successfully → 確保初始化任務跑完（migration、seed）。
    healthcheck:
      # 把網址補成自己的 PORT 與 /healthcheck 路徑
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:8080/healthcheck'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
