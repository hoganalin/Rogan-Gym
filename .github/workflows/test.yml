name: 後端 Contract Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PORT: 8080
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: rfitness_ci
  DB_PASSWORD: rfitness_ci_password
  DB_DATABASE: fitness
  DB_SYNCHRONIZE: "true"
  DB_ENABLE_SSL: "false"
  JWT_SECRET: ci-only-secret-666
  JWT_EXPIRES_DAY: 30d
  LOG_LEVEL: warn

jobs:
  contract:
    name: 合約測試
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [catalog, accounts, coach-management, discovery, bookings, revenue]
    services:
      postgres:
        image: postgres:16.4-alpine3.20
        env:
          POSTGRES_USER: rfitness_ci
          POSTGRES_PASSWORD: rfitness_ci_password
          POSTGRES_DB: fitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rfitness_ci -d fitness"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安裝依賴
        run: npm ci

      - name: 檢查 backend/ 結構
        run: node .github/scripts/check-backend.js

      - name: 安裝後端依賴
        run: npm --prefix backend ci

      - name: 啟動後端（根目錄 npm start 會代理到 backend/start）
        run: |
          npm start > server.log 2>&1 &
          echo "等待 server 就緒（GET /healthcheck 要在資料庫可用後回 200）"
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8080/healthcheck" > /dev/null; then
              echo "✅ server 就緒"
              exit 0
            fi
            sleep 2
          done
          echo "❌ 等了 60 秒 server 還沒就緒 — 下面是 server log："
          cat server.log
          exit 1

      - name: 執行 ${{ matrix.suite }} 合約測試
        run: npx jest test/${{ matrix.suite }}.test.js --runInBand --json --outputFile=jest-result.json

      - name: 測試結果摘要
        if: always()
        run: node .github/scripts/summary.js "合約測試 (${{ matrix.suite }})" jest-result.json

      - name: 測試失敗時輸出後端記錄
        if: failure()
        run: |
          echo "========== server.log =========="
          cat server.log || echo "(沒有 server.log)"

  dockerize:
    name: 容器化測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose 啟動後端 + 資料庫（backend 服務）
        run: |
          docker compose up -d --build backend postgres
          echo "等待 backend 容器就緒"
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:8080/healthcheck" > /dev/null; then
              echo "✅ backend 容器就緒"
              exit 0
            fi
            sleep 2
          done
          echo "❌ backend 容器 90 秒內沒就緒 — 看 logs："
          docker compose logs backend
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安裝依賴
        run: npm ci

      - name: smoke 測試（容器裡的後端要跟本機開發時行為一致）
        run: npx jest test/smoke.test.js --runInBand --json --outputFile=jest-result.json

      - name: 📊 smoke 結果總表
        if: always()
        run: node .github/scripts/summary.js "smoke（容器化）" jest-result.json

      - name: 持久化檢查（資料要存在 PostgreSQL，重啟不能消失）
        run: |
          MARK="persist_check_$(date +%s)_$RANDOM"
          echo "建立持久化測試會員：$MARK"
          curl -sf -X POST "http://localhost:8080/api/users/signup" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"持久化驗證\",\"email\":\"$MARK@example.com\",\"password\":\"Persist1234\"}" > /dev/null
          echo "重啟 backend 容器…"
          docker compose restart backend
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8080/healthcheck" > /dev/null; then break; fi
            sleep 2
          done
          echo "重啟後資料還在嗎？"
          if curl -sf -X POST "http://localhost:8080/api/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$MARK@example.com\",\"password\":\"Persist1234\"}" | \
            node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);process.exit(j.status==='success'&&j.data?.token?0:1)})"; then
            echo "✅ 重啟後資料仍可存取 — 資料確實存進資料庫"
            echo "| ✅ | 持久化檢查：重啟容器後資料還在（資料保存在 PostgreSQL） |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 重啟後資料不見了 — 資料必須存進 PostgreSQL，不能放在程式記憶體裡"
            echo "| ❌ | 持久化檢查：重啟容器後資料不見了 — 資料必須存進 PostgreSQL，不能放在程式記憶體裡 |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 失敗 → 印出容器 logs
        if: failure()
        run: docker compose logs backend postgres || true
